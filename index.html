<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --void:#0A0C0F; --panel:#12151A; --gold:#C9A227; --green:#3ECF8E; --red:#EF5350; --text-primary:#E7E5E0; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ background:var(--void); color:var(--text-primary); font-family:'Inter',sans-serif; min-height:100vh;
       -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none; 
      }
  .num{ font-family:'JetBrains Mono',monospace; }
  
  #alertModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; align-items: center; justify-content: center; }
  .modal-content { background: var(--panel); border: 1px solid var(--red); padding: 30px; border-radius: 12px; text-align: center; max-width: 400px; width: 90%; }
  
  /* --- ส่วนที่แก้ไข Layout ด้านบน --- */
  /* --- ส่วนที่แก้ไข Layout ด้านบน --- */
  #summaryBox { padding: 20px 28px; border-bottom: 1px solid #242A32; display: none; }
  
  /* ใช้ Grid แบ่ง 3 คอลัมน์ (ซ้าย=ข้อมูล, กลาง=ป้ายแบรนด์, ขวา=ว่างเพื่อสมดุล) */
  .summary-container { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; }
  .stats-group { display: flex; flex-direction: column; justify-self: start; }
  
  /* ขยายขนาดแบนเนอร์และย้ายมาตรงกลาง */
  .brand-banner { display: flex; align-items: center; gap: 25px; background: rgba(20, 25, 30, 0.5); padding: 20px 40px; border-radius: 16px; border: 2px solid var(--gold); box-shadow: 0 4px 30px rgba(201, 162, 39, 0.2); justify-self: center; }
  .brand-banner img { width: 150px; height: 150px; object-fit: cover; border-radius: 50%; border: 3px solid var(--gold); box-shadow: 0 0 20px rgba(201, 162, 39, 0.4); }
  .brand-banner .brand-text { font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 700; color: var(--gold); letter-spacing: 0.05em; line-height: 1.1; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

  /* ปรับให้รองรับหน้าจอมือถือ (ย่อขนาดลงและจับเรียงแนวตั้ง) */
  @media (max-width: 900px) {
      .summary-container { grid-template-columns: 1fr; text-align: center; gap: 30px; }
      .stats-group { justify-self: center; align-items: center; }
      .brand-banner { flex-direction: column; text-align: center; padding: 20px; }
      .brand-banner .brand-text { font-size: 32px; }
      .brand-banner img { width: 100px; height: 100px; }
  }

  /* --- ปุ่ม Navigation ฝั่งขวา --- */
  .nav-btn {
      background: rgba(0, 210, 255, 0.1);
      color: #00d2ff;
      border: 1px solid #00d2ff;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      display: inline-block;
  }
  .nav-btn:hover {
      background: #00d2ff;
      color: var(--void);
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
  }
  .right-action {
      justify-self: end; /* ดันปุ่มไปชิดขวาสุด */
  }
  
  /* ให้ปุ่มเด้งมาอยู่ตรงกลางเมื่อเปิดในมือถือ */
  @media (max-width: 900px) {
      .right-action { justify-self: center; margin-top: -10px; }
  }
  
  /* ------------------------------ */
</style>
</head>
<body>

<div id="loginScreen" style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;">
  <div class="mark" style="font-size:24px; font-weight:700; margin-bottom: 20px;">PORTFOLIO MONITOR</div>
  <div id="gsiButton"></div>

  <!-- 👇 เพิ่มปุ่มตรงนี้ เพื่อให้กดข้ามไปหน้า AI ได้เลยจากหน้า Login 👇 -->
  <a href="Celestial_Terminal.html" class="nav-btn" style="margin-top: 30px; font-size: 14px; padding: 12px 24px;">🧠 เข้าสู่หน้า AI MATRIX TERMINAL</a>
</div>
  
</div>

<div id="summaryBox">
  <div class="summary-container">
    <!-- ฝั่งซ้าย: ข้อมูลตัวเลข -->
    <div class="stats-group">
      <div class="sum-label">TOTAL ACCOUNTS</div>
      <div id="totalAccounts" class="sum-val" style="color:var(--gold);">0</div>
      
      <div class="sum-label">TOTAL FLOATING P/L</div>
      <div id="totalToday" class="sum-val">0.00 USC</div>
      
      <div class="sum-label">WORST MAX DD</div>
      <div id="totalDD" class="dd-val">0.00 USC</div>
    </div>
    
    <!-- ตรงกลาง: โลโก้และชื่อ (ใหญ่ขึ้น 2 เท่า) -->
    <div class="brand-banner">
      <img src="178601.jpg" alt="PIP NOMINATOR QUANTUM">
      <div class="brand-text">PIP_NOMINATOR<br>QUANTUM_TH</div>
    </div>

   <!-- ฝั่งขวา: ปุ่ม Link ไปหน้ากราฟ AI -->
    <div class="right-action">
      <a href="Celestial_Terminal.html" class="nav-btn">🧠 AI MATRIX TERMINAL</a>
    </div>
  </div>
</div>

<main id="mainEl"><div id="cardsEl"></div></main>

<div id="alertModal">
  <div class="modal-content">
    <h2 class="modal-title" style="color:var(--red);">⚠️ WARNING</h2>
    <div id="alertMessage" style="margin:20px 0; line-height: 1.6;"></div>
    <button onclick="document.getElementById('alertModal').style.display='none'" style="padding:10px 20px; background:var(--red); color:#fff; border:none; border-radius:4px; font-weight:600; cursor:pointer;">รับทราบ / ปิดแจ้งเตือน</button>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhonKaOEh5rXXHThttjEps4W1KTEhPfntRwPUuhqIqHkZhg8odWnA9XshOzljJ8368/exec";
const GOOGLE_CLIENT_ID = "146280162769-546li5pjl9cpb53cruqpjuvu0i42i2pu.apps.googleusercontent.com";
let idToken = null, charts = {};

window.onload = () => {
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: res => {
    idToken = res.credential;
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("summaryBox").style.display = "block";
    fetchData();
    setInterval(fetchData, 30000);
  }});
  google.accounts.id.renderButton(document.getElementById("gsiButton"), { theme: "filled_black", size: "large", shape: "pill" });
};

// ฟังก์ชันคำนวณ Profit Week
function calculateProfitWeek(currentProfit, historyRows) {
  if (!historyRows || historyRows.length === 0) return currentProfit;
  
  const now = new Date();
  const currentDay = now.getDay();
  const diffToMon = currentDay === 0 ? 6 : currentDay - 1;
  const monday = new Date(now);
  monday.setDate(now.getDate() - diffToMon);
  monday.setHours(0,0,0,0);
  
  const todayStart = new Date(now);
  todayStart.setHours(0,0,0,0);

  const dailyFinalProfits = {};

  for (let i = 0; i < historyRows.length; i++) {
    const rowDate = new Date(historyRows[i].updated);
    if (rowDate >= monday && rowDate < todayStart) {
      const dateKey = rowDate.getFullYear() + "-" + (rowDate.getMonth()+1) + "-" + rowDate.getDate();
      dailyFinalProfits[dateKey] = Number(historyRows[i].profit || 0);
    }
  }

  let pastDaysProfit = 0;
  for (let dateKey in dailyFinalProfits) {
    pastDaysProfit += dailyFinalProfits[dateKey];
  }

  return pastDaysProfit + currentProfit;
}

async function fetchData(){
  if(!idToken) return;
  try {
    const res = await fetch(SCRIPT_URL + "?id_token=" + encodeURIComponent(idToken));
    const data = await res.json();
    
    const totalPL = data.accounts.reduce((s,a) => s + Number(a.profit||0), 0);
    const worstDD = Math.max(...data.accounts.map(a => Number(a.maxdd||0)));
    
        document.getElementById('totalAccounts').innerText = data.accounts.length;
    
    // ปรับ Total Floating เป็นสีเขียว (pos) และ Worst Max DD เป็นสีแดง (neg) เสมอ
    document.getElementById('totalToday').innerHTML = `<span class="pos">${totalPL>=0?'+':''}${totalPL.toFixed(2)} USC</span>`;
    document.getElementById('totalDD').innerHTML = `<span class="neg">${worstDD.toFixed(2)} USC</span>`;

    document.getElementById('cardsEl').innerHTML = data.accounts.map(acc => {
      const rows = data.history[acc.account] || [];
      const pw = calculateProfitWeek(Number(acc.profit), rows);
      return `
      <div class="card">
        <h3 class="num">#${acc.account}</h3>
        <div class="metrics">
          <!-- บังคับ BALANCE และ PROFIT เป็นสีเขียว (pos), MAX DD เป็นสีแดง (neg) -->
          <div><div style="font-size:10px;color:#7A828C;">BALANCE</div><div class="num pos">${Number(acc.balance).toFixed(2)} USC</div></div>
          <div><div style="font-size:10px;color:#7A828C;">MAX DD</div><div class="num neg">${Number(acc.maxdd).toFixed(2)} USC</div></div>
          <div><div style="font-size:10px;color:#7A828C;">PROFIT TODAY</div><div class="num pos">${acc.profit>=0?'+':''}${Number(acc.profit).toFixed(2)} USC</div></div>
          <div><div style="font-size:10px;color:#7A828C;">PROFIT WEEK</div><div class="num pos">${pw>=0?'+':''}${pw.toFixed(2)} USC</div></div>
        </div>
        <div class="detail-chart"><canvas id="chart-${acc.account}"></canvas></div>
      </div>`;
    }).join('');

    
    data.accounts.forEach(acc => drawChart(acc.account, data.history[acc.account] || []));
    checkAlerts(data.accounts);
  } catch (e) {
    console.error("Error fetching data: ", e);
  }
}

// ฟังก์ชันวาดกราฟ
function drawChart(id, rows) {
  const ctx = document.getElementById('chart-'+id).getContext('2d');
  if(charts[id]) charts[id].destroy();
  charts[id] = new Chart(ctx, {
    type: 'line',
    data: { 
      labels: rows.map(r => {
        let d = new Date(r.updated);
        if(isNaN(d)) return r.updated;
        return String(d.getDate()).padStart(2, '0') + '/' + 
               String(d.getMonth()+1).padStart(2, '0') + ' ' + 
               String(d.getHours()).padStart(2, '0') + ':' + 
               String(d.getMinutes()).padStart(2, '0');
      }), 
      datasets: [{ 
        data: rows.map(r=>Number(r.profit)), 
        borderColor: '#C9A227',
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.2
      }] 
    },
    options: { 
      responsive: true, 
      maintainAspectRatio: false, 
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#7A828C', maxTicksLimit: 5, font: {family: 'JetBrains Mono', size: 10} } },
        y: { ticks: { color: '#7A828C', font: {family: 'JetBrains Mono', size: 10} } }
      }
    }
  });
}

// ฟังก์ชันเช็ค Alert พร้อมระบบจดจำลงเครื่อง (LocalStorage) รีเซ็ตเมื่อขึ้นวันใหม่
function checkAlerts(accounts) {
  const today = new Date().toLocaleDateString('en-CA'); 
  let savedAlerts = JSON.parse(localStorage.getItem('ddAlertsData')) || {};
  
  if (savedAlerts.date !== today) {
    savedAlerts = { date: today, triggered: {} };
  }
  
  let hasUpdate = false;

  accounts.forEach(acc => {
    const dd = Number(acc.maxdd || 0);
    const id = String(acc.account);
    const currentAlertLevel = savedAlerts.triggered[id] || 0; 

    if (dd > 2500 && currentAlertLevel !== 2) {
      savedAlerts.triggered[id] = 2; 
      hasUpdate = true;
      triggerAlert("🚨 CRITICAL: DD > 2500 USC", `พอร์ต <b class="num">#${id}</b> <br>ยอด Drawdown ปัจจุบัน: <b>${dd.toFixed(2)} USC</b>`, true);
    } 
    else if (dd > 1500 && dd <= 2500 && currentAlertLevel !== 1 && currentAlertLevel !== 2) {
      savedAlerts.triggered[id] = 1; 
      hasUpdate = true;
      triggerAlert("⚠️ WARNING: DD > 1500 USC", `พอร์ต <b class="num">#${id}</b> <br>ยอด Drawdown ปัจจุบัน: <b>${dd.toFixed(2)} USC</b>`, false);
    } 
    else if (dd <= 1500 && currentAlertLevel > 0) {
      delete savedAlerts.triggered[id];
      hasUpdate = true;
    }
  });

  if (hasUpdate) {
    localStorage.setItem('ddAlertsData', JSON.stringify(savedAlerts));
  }
}

function triggerAlert(title, msg, double) {
  document.querySelector('.modal-title').innerHTML = title;
  document.getElementById('alertMessage').innerHTML = msg;
  document.getElementById('alertModal').style.display = 'flex';
  const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
  audio.play().catch(e=>console.log(e));
  if(double) setTimeout(()=>audio.play().catch(e=>console.log(e)), 600);
}
</script>

    <!-- SECURITY SCRIPT: ป้องกันคลิกขวาและปุ่มลัด -->
    <!-- ========================================== -->
    <script>
        // 1. ป้องกันการคลิกขวา (Right Click)
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // 2. ป้องกันการกดปุ่มลัดบนคีย์บอร์ด
        document.onkeydown = function(e) {
            // บล็อก F12 (เปิดเครื่องมือ DevTools)
            if (e.keyCode == 123) {
                return false;
            }
            // บล็อก Ctrl+U (View Source)
            if (e.ctrlKey && e.keyCode == 85) {
                return false;
            }
            // บล็อก Ctrl+Shift+I / J / C (เปิดแผง Inspect Element)
            if (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) {
                return false;
            }
            // บล็อก Ctrl+S (Save หน้าเว็บลงเครื่อง)
            if (e.ctrlKey && e.keyCode == 83) {
                return false;
            }
            // บล็อก Ctrl+P (Print หน้าเว็บ)
            if (e.ctrlKey && e.keyCode == 80) {
                return false;
            }
        };
    </script>
</body>
</html>
