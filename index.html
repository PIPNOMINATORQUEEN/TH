<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Monitor</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --void:#0A0C0F; --panel:#12151A; --gold:#C9A227; --green:#3ECF8E; --red:#EF5350; --text-dim:#7A828C; }
  body{ background:var(--void); color:#E7E5E0; font-family:'Inter',sans-serif; }
  .num{ font-family:'JetBrains Mono',monospace; }
  /* ส่วนเสริม: ปรับแถบบนให้เหมือนภาพตัวอย่าง */
  #topSummary { padding: 20px 28px; border-bottom: 1px solid #242A32; margin-bottom: 20px; }
  .summary-val { font-size: 32px; font-weight: 700; }
  .summary-dd { font-size: 20px; color: var(--red); margin-top: 5px; }
  .card{ background:var(--panel); border:1px solid #242A32; padding:16px; margin: 10px 28px; cursor:pointer; }
  .pos{ color:var(--green); } .neg{ color:var(--red); }
</style>
</head>
<body>

<div id="loginScreen"><div class="mark">PORTFOLIO MONITOR</div><div id="gsiButton"></div></div>
<div id="topSummary" style="display:none;">
    <div id="totalToday" class="summary-val">0.00 USC</div>
    <div id="totalDD" class="summary-dd">0.00 USC</div>
</div>
<main id="mainEl"><div id="cardsEl"></div></main>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhonKaOEh5rXXHThttjEps4W1KTEhPfntRwPUuhqIqHkZhg8odWnA9XshOzljJ8368/exec";
const GOOGLE_CLIENT_ID = "146280162769-546li5pjl9cpb53cruqpjuvu0i42i2pu.apps.googleusercontent.com";
let idToken = null;

window.onload = () => {
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse });
  google.accounts.id.renderButton(document.getElementById("gsiButton"), { theme: "filled_black", size: "large" });
};

function handleCredentialResponse(response){
  idToken = response.credential;
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("topSummary").style.display = "block";
  fetchData();
}

// ระบบคำนวณ Profit Week ที่ถูกต้องโดยอ้างอิงจากข้อมูลแถวแรกของวันจันทร์ใน History
function calculateProfitWeek(currentProfit, historyRows) {
  if (!historyRows || historyRows.length === 0) return 0;
  
  const now = new Date();
  const day = now.getDay();
  const diffToMonday = day === 0 ? 6 : day - 1; 
  const startOfWeek = new Date(now);
  startOfWeek.setDate(now.getDate() - diffToMonday);
  startOfWeek.setHours(0,0,0,0);

  let baseProfit = Number(historyRows[0].profit || 0);
  for (let i = historyRows.length - 1; i >= 0; i--) {
    let rowDate = new Date(historyRows[i].updated);
    if (rowDate < startOfWeek) {
      baseProfit = Number(historyRows[i].profit || 0);
      break;
    }
  }
  return currentProfit - baseProfit;
}

async function fetchData(){
  const res = await fetch(SCRIPT_URL + "?id_token=" + encodeURIComponent(idToken));
  const data = await res.json();
  
  // รวมยอด Profit Today ทั้ง 5 พอร์ต
  const totalToday = data.accounts.reduce((s,a) => s + Number(a.profit||0), 0);
  const totalDD = Math.max(...data.accounts.map(a => Number(a.maxdd||0)));
  
  document.getElementById('totalToday').innerHTML = `<span class="${totalToday>=0?'pos':'neg'}">${totalToday>=0?'+':''}${totalToday.toFixed(2)} USC</span>`;
  document.getElementById('totalDD').textContent = totalDD.toFixed(2) + " USC";

  document.getElementById('cardsEl').innerHTML = data.accounts.map(acc => {
    const pw = calculateProfitWeek(Number(acc.profit), data.history[acc.account] || []);
    return `
    <div class="card">
      <h3>#${acc.account}</h3>
      <p>BALANCE: ${Number(acc.balance).toFixed(2)} USC</p>
      <p>PROFIT TODAY: <span class="${Number(acc.profit)>=0?'pos':'neg'}">${Number(acc.profit).toFixed(2)} USC</span></p>
      <p>PROFIT WEEK: <span class="${pw>=0?'pos':'neg'}">${pw.toFixed(2)} USC</span></p>
      <p>MAX DD: ${Number(acc.maxdd).toFixed(2)} USC</p>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
