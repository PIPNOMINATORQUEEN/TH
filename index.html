<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Monitor</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --void:#0A0C0F; --panel:#12151A; --panel-raised:#171B21; --hairline:#242A32; --text-primary:#E7E5E0; --text-dim:#7A828C; --gold:#C9A227; --gold-dim:#8A7420; --green:#3ECF8E; --red:#EF5350; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ background:var(--void); color:var(--text-primary); font-family:'Inter',sans-serif; min-height:100vh; }
  .num{ font-family:'JetBrains Mono',monospace; }
  
  /* Alert Modal */
  #alertModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; align-items: center; justify-content: center; }
  .modal-content { background: var(--panel); border: 1px solid var(--red); padding: 30px; border-radius: 12px; text-align: center; max-width: 400px; width: 90%; }
  .modal-title { color: var(--red); font-size: 20px; margin-bottom: 15px; }
  .modal-btn { background: var(--red); color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin-top: 15px; }
  
  #loginScreen{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:24px; text-align:center; }
  header{ padding:18px 28px; border-bottom:1px solid var(--hairline); display:none; }
  .brand-container { padding: 22px 28px 0; display:none; }
  .brand-card { background: var(--panel); border: 1px solid var(--gold-dim); padding: 15px; display: flex; align-items: center; gap: 20px; border-radius: 8px; }
  .brand-image { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--gold); }
  .agg-strip{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--hairline); margin:18px 28px 0; display:none; }
  .agg-cell{ background:var(--panel); padding:14px; }
  .card{ background:var(--panel); border:1px solid var(--hairline); padding:16px; margin: 10px 28px; cursor:pointer; }
  .metrics{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .value{ font-size:16px; font-weight:600; }
  .pos{ color:var(--green); } .neg{ color:var(--red); }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="mark">PORTFOLIO MONITOR</div>
  <div id="gsiButton"></div>
</div>

<header id="headerEl">
  <div class="user-box"><span id="userEmail"></span> <button id="signOutBtn">Sign out</button></div>
</header>

<div class="brand-container" id="brandEl">
    <div class="brand-card">
        <img src="https://img1.pic.in.th/images/178601.jpg" class="brand-image">
        <div class="brand-name" style="color:var(--gold);">PIP_NOMINATOR_QUEEN_TH</div>
    </div>
</div>

<div class="agg-strip" id="aggStrip"></div>
<main id="mainEl"><div id="cardsEl"></div></main>

<div id="alertModal">
  <div class="modal-content">
    <div class="modal-title">⚠️ WARNING</div>
    <div id="alertMessage"></div>
    <button class="modal-btn" onclick="closeAlert()">รับทราบ</button>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhonKaOEh5rXXHThttjEps4W1KTEhPfntRwPUuhqIqHkZhg8odWnA9XshOzljJ8368/exec";
const GOOGLE_CLIENT_ID = "146280162769-546li5pjl9cpb53cruqpjuvu0i42i2pu.apps.googleusercontent.com";
const ALERT_STEP_1 = 1500;
const ALERT_STEP_2 = 2500;

let idToken = null, alertedAccounts = new Map();
const alertSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

window.onload = () => {
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse });
  google.accounts.id.renderButton(document.getElementById("gsiButton"), { theme: "filled_black", size: "large", shape: "pill" });
};

function handleCredentialResponse(response){
  idToken = response.credential;
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("headerEl").style.display = "block";
  document.getElementById("brandEl").style.display = "block";
  document.getElementById("aggStrip").style.display = "grid";
  fetchData();
  setInterval(fetchData, 30000);
  if ("Notification" in window) Notification.requestPermission();
}

document.getElementById("signOutBtn").onclick = () => location.reload();

function calculateProfitWeek(currentProfit, historyRows) {
  if (!historyRows || historyRows.length === 0) return currentProfit;
  const now = new Date(), diffToMon = now.getDay() === 0 ? 6 : now.getDay() - 1;
  const startOfWeek = new Date(now);
  startOfWeek.setDate(now.getDate() - diffToMon);
  startOfWeek.setHours(0,0,0,0);
  let baseProfit = Number(historyRows[0].profit || 0);
  for (let i = historyRows.length - 1; i >= 0; i--) {
    if (new Date(historyRows[i].updated).getTime() < startOfWeek.getTime()) {
      baseProfit = Number(historyRows[i].profit || 0);
      break;
    }
  }
  return currentProfit - baseProfit;
}

async function fetchData(){
  const res = await fetch(SCRIPT_URL + "?id_token=" + encodeURIComponent(idToken));
  const data = await res.json();
  document.getElementById("userEmail").textContent = data.email;
  renderData(data.accounts, data.history || {});
  checkAlerts(data.accounts);
}

function renderData(accounts, history){
  const totalBal = accounts.reduce((s,a)=>s+Number(a.balance||0),0);
  const totalPL = accounts.reduce((s,a)=>s+Number(a.profit||0),0);
  document.getElementById('aggStrip').innerHTML = `
    <div class="agg-cell"><div class="label">Balance</div><div class="value">${totalBal.toFixed(2)} USC</div></div>
    <div class="agg-cell"><div class="label">Profit</div><div class="value ${totalPL>=0?'pos':'neg'}">${totalPL.toFixed(2)} USC</div></div>`;
  document.getElementById('cardsEl').innerHTML = accounts.map(acc => {
    const pw = calculateProfitWeek(Number(acc.profit), history[acc.account] || []);
    return `
    <div class="card">
      <h3>#${acc.account}</h3>
      <div class="metrics">
        <div>Balance: ${Number(acc.balance).toFixed(2)} USC</div>
        <div>Profit Week: <span class="${pw>=0?'pos':'neg'}">${pw.toFixed(2)} USC</span></div>
        <div>Max DD: ${Number(acc.maxdd).toFixed(2)} USC</div>
      </div>
    </div>`;
  }).join('');
}

function checkAlerts(accounts) {
  accounts.forEach(acc => {
    const dd = Number(acc.maxdd || 0);
    const id = String(acc.account);
    if (dd > ALERT_STEP_2 && (alertedAccounts.get(id) !== 2)) {
      alertedAccounts.set(id, 2);
      triggerAlert("🚨 CRITICAL: DD > 2500 USC", `พอร์ต #${id} ยอด DD: ${dd.toFixed(2)} USC`, true);
    } else if (dd > ALERT_STEP_1 && (alertedAccounts.get(id) !== 1)) {
      alertedAccounts.set(id, 1);
      triggerAlert("⚠️ WARNING: DD > 1500 USC", `พอร์ต #${id} ยอด DD: ${dd.toFixed(2)} USC`, false);
    } else if (dd <= ALERT_STEP_1) {
      alertedAccounts.delete(id);
    }
  });
}

function triggerAlert(title, msg, double) {
  document.querySelector('.modal-title').innerText = title;
  document.getElementById('alertMessage').innerText = msg;
  document.getElementById('alertModal').style.display = 'flex';
  alertSound.play();
  if(double) setTimeout(()=>alertSound.play(), 600);
  if("Notification" in window) new Notification(title, {body: msg});
}

function closeAlert() { document.getElementById('alertModal').style.display = 'none'; }
</script>
</body>
</html>
