<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Monitor</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0A0C0F; --panel:#12151A; --panel-raised:#171B21; --hairline:#242A32;
    --text-primary:#E7E5E0; --text-dim:#7A828C;
    --gold:#C9A227; --gold-dim:#8A7420; --green:#3ECF8E; --red:#EF5350;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ background:var(--void); color:var(--text-primary); font-family:'Inter',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
  .num{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }

  /* ---------- login gate ---------- */
  #loginScreen{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:24px;
    text-align:center;
  }
  #loginScreen .mark{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; letter-spacing:0.02em; }
  #loginScreen .mark .dot{ color:var(--gold); }
  #loginScreen .sub{ color:var(--text-dim); font-size:13px; max-width:340px; line-height:1.6; }
  #loginError{ color:var(--red); font-size:13px; display:none; max-width:340px; }

  /* ---------- header ---------- */
  header{
    padding:18px 28px 16px; border-bottom:1px solid var(--hairline);
    position:sticky; top:0; background:rgba(10,12,15,0.92); backdrop-filter:blur(6px); z-index:10;
    display:none;
  }
  .header-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .mark{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; letter-spacing:0.02em; }
  .brand .mark .dot{ color:var(--gold); }
  .brand .sub{ color:var(--text-dim); font-size:12px; letter-spacing:0.08em; text-transform:uppercase; }
  .user-box{ display:flex; align-items:center; gap:12px; font-size:12px; color:var(--text-dim); }
  .user-box .email{ color:var(--text-primary); }
  .signout{ background:none; border:1px solid var(--hairline); color:var(--text-dim); font-size:11px; padding:6px 10px; cursor:pointer; }
  .signout:hover{ border-color:var(--gold-dim); color:var(--text-primary); }
  .goldrule{ height:1px; margin-top:14px; background:linear-gradient(90deg, var(--gold) 0%, rgba(201,162,39,0.05) 45%, transparent 70%); }

  /* ---------- aggregate strip ---------- */
  .agg-strip{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--hairline); border:1px solid var(--hairline); margin:18px 28px 0; }
  .agg-cell{ background:var(--panel); padding:14px 16px; }
  .agg-cell .label{ font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px; }
  .agg-cell .value{ font-size:22px; font-weight:600; }
  .agg-cell .value.pos{ color:var(--green); } .agg-cell .value.neg{ color:var(--red); }

  main{ padding:22px 28px 60px; display:none; }
  .grid-title{ font-family:'Space Grotesk',sans-serif; font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); margin:26px 0 12px; display:flex; align-items:center; gap:10px; }
  .grid-title::after{ content:""; flex:1; height:1px; background:var(--hairline); }
  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }

  .card{ background:var(--panel); border:1px solid var(--hairline); padding:16px 18px; cursor:pointer; transition:border-color .15s ease, transform .15s ease; }
  .card:hover{ border-color:var(--gold-dim); transform:translateY(-1px); }
  .card.expanded{ border-color:var(--gold); grid-column:1 / -1; cursor:default; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
  .acc-no{ font-size:18px; font-weight:600; }
  .ea-name{ font-size:11.5px; color:var(--text-dim); margin-top:3px; }
  .updated{ font-size:10px; color:var(--text-dim); text-align:right; white-space:nowrap; }

  .metrics{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; }
  .metric .label{ font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim); }
  .metric .value{ font-size:16px; margin-top:2px; }
  .metric .value.pos{ color:var(--green); } .metric .value.neg{ color:var(--red); }
  .dd-bar-track{ height:4px; background:var(--panel-raised); margin-top:6px; overflow:hidden; }
  .dd-bar-fill{ height:100%; background:var(--red); }

  .spark{ margin-top:14px; height:44px; }
  .detail-chart{ margin-top:16px; height:260px; }
  .no-history{ margin-top:14px; font-size:11px; color:var(--text-dim); }

  .empty{ color:var(--text-dim); font-size:13px; padding:30px 4px; text-align:center; border:1px dashed var(--hairline); }
  footer{ padding:20px 28px 40px; color:var(--text-dim); font-size:11px; display:none; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="mark">PORTFOLIO<span class="dot">·</span>MONITOR</div>
  <div class="sub">เข้าสู่ระบบด้วย Google account เพื่อดูข้อมูล Account ที่ผูกไว้กับอีเมลของคุณ</div>
  <div id="gsiButton"></div>
  <div id="loginError"></div>
</div>

<header id="headerEl">
  <div class="header-row">
    <div class="brand">
      <div class="mark">PORTFOLIO<span class="dot">·</span>MONITOR</div>
      <div class="sub">Multi-Account EA Dashboard</div>
    </div>
    <div class="user-box">
      <span class="email" id="userEmail"></span>
      <button class="signout" id="signOutBtn">Sign out</button>
    </div>
  </div>
  <div class="goldrule"></div>
</header>

<div class="agg-strip" id="aggStrip"></div>

<main id="mainEl">
  <div class="grid-title">Your Accounts</div>
  <div class="cards" id="cardsEl"><div class="empty">กำลังโหลดข้อมูล…</div></div>
</main>

<footer id="footerEl">อัปเดตอัตโนมัติทุก 30 วินาที · ข้อมูลจาก Google Sheet · ถ้าค้างไว้นานเกิน 1 ชม. รีเฟรชหน้าเพื่อ login ใหม่</footer>


<!-- คัดลอกเฉพาะ script ด้านล่างนี้ไปแทนที่ของเดิมใน index.html -->
<script>
/* ====== ตั้งค่าเริ่มต้น ====== */
let expandedAccount = null;
let charts = {};
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzi5pwN7x4oHek4cAPbIW_rEqJSHxFMG5P8vJ3WnDwjEZvfeAmlJ6p-GIqGND1zPOfC/exec"; 
const GOOGLE_CLIENT_ID = "146280162769-546li5pjl9cpb53cruqpjuvu0i42i2pu.apps.googleusercontent.com";

let idToken = null;
let pollTimer = null;

window.onload = () => {
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(document.getElementById("gsiButton"), { theme: "filled_black", size: "large", shape: "pill" });
};

function handleCredentialResponse(response){
  idToken = response.credential;
  showDashboard();
  fetchData();
  pollTimer = setInterval(fetchData, 30000);
}

function showDashboard(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("headerEl").style.display = "block";
  document.getElementById("mainEl").style.display = "block";
  document.getElementById("footerEl").style.display = "block";
}

/* ====== ฟังก์ชัน Helper ====== */
function fmtMoney(n){ return (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtSigned(n){ const v=Number(n)||0; return (v>=0?'+':'')+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function timeAgo(dateStr){
  if(!dateStr) return "";
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return "";
  const diff = Math.floor((Date.now()-d.getTime())/1000);
  if(diff<60) return diff+'s ago';
  if(diff<3600) return Math.floor(diff/60)+'m ago';
  if(diff<86400) return Math.floor(diff/3600)+'h ago';
  return d.toLocaleDateString();
}

async function fetchData(){
  if(!idToken) return;
  try {
    const res = await fetch(SCRIPT_URL + "?id_token=" + encodeURIComponent(idToken));
    const data = await res.json();
    if(data.status !== "ok") throw new Error(data.message);
    document.getElementById("userEmail").textContent = data.email;
    // ส่งข้อมูล history ไปด้วยเสมอ
    renderAggregate(data.accounts);
    renderCards(data.accounts, data.history || {});
  } catch(err) {
    console.error(err);
    document.getElementById('cardsEl').innerHTML = '<div class="empty">Error: ' + err.message + '</div>';
  }
}

function renderAggregate(accounts){
  const totalBalance = accounts.reduce((s,a)=>s+Number(a.balance||0),0);
  const totalProfit  = accounts.reduce((s,a)=>s+Number(a.profit||0),0);
  const worstDD = accounts.length ? Math.max(...accounts.map(a=>Number(a.maxdd||0))) : 0;
  const cells = [
    {label:'Accounts', value: accounts.length, cls:''},
    {label:'Total Balance', value:'$'+fmtMoney(totalBalance), cls:''},
    {label:'Total Floating P/L', value: fmtSigned(totalProfit), cls: totalProfit>=0?'pos':'neg'},
    {label:'Worst Max DD', value: worstDD.toFixed(2)+'%', cls: worstDD>10?'neg':''},
  ];
  document.getElementById('aggStrip').innerHTML = cells.map(c=>`
    <div class="agg-cell"><div class="label">${c.label}</div><div class="value num ${c.cls}">${c.value}</div></div>`).join('');
}

function renderCards(accounts, history){
  const wrap = document.getElementById('cardsEl');
  if(!accounts.length){
    wrap.innerHTML = '<div class="empty">ไม่พบ Account ที่ผูกกับอีเมลนี้</div>';
    return;
  }
  wrap.innerHTML = accounts.map(acc=>{
    const accId = String(acc.account);
    const profit = Number(acc.profit||0);
    const dd = Number(acc.maxdd||0);
    const isExpanded = expandedAccount === accId;
    const rows = history[accId] || [];
    return `
    <div class="card ${isExpanded?'expanded':''}" data-acc="${accId}">
      <div class="card-top">
        <div><div class="acc-no num">#${accId}</div><div class="ea-name">${acc.eaName||'—'}</div></div>
        <div class="updated">${timeAgo(acc.updated)}</div>
      </div>
      <div class="metrics">
        <div class="metric"><div class="label">Balance</div><div class="value num">$${fmtMoney(acc.balance)}</div></div>
        <div class="metric"><div class="label">Equity</div><div class="value num">$${fmtMoney(acc.equity)}</div></div>
        <div class="metric"><div class="label">Profit</div><div class="value num ${profit>=0?'pos':'neg'}">${fmtSigned(profit)}</div></div>
        <div class="metric"><div class="label">Max DD</div><div class="value num">${dd.toFixed(2)}%</div>
          <div class="dd-bar-track"><div class="dd-bar-fill" style="width:${Math.min(dd,100)}%"></div></div>
        </div>
      </div>
      ${rows.length ? (isExpanded ? `<div class="detail-chart"><canvas id="chart-${accId}"></canvas></div>` : `<div class="spark"><canvas id="spark-${accId}"></canvas></div>`) : `<div class="no-history">ไม่มีข้อมูลกราฟ</div>`}
    </div>`;
  }).join('');

  accounts.forEach(acc=>{
    const accId = String(acc.account);
    const rows = history[accId] || [];
    if(rows.length) drawChart(accId, rows, expandedAccount === accId);
  });

  wrap.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const accId = card.getAttribute('data-acc');
      expandedAccount = expandedAccount === accId ? null : accId;
      renderCards(accounts, history);
    });
  });
}

function drawChart(accId, rows, expanded){
  const canvasId = (expanded ? 'chart-' : 'spark-') + accId;
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  if(charts[canvasId]) charts[canvasId].destroy();

  const labels = rows.map(r => new Date(r.updated).toLocaleString());
  const profits = rows.map(r => Number(r.profit||0));
  const lastVal = profits.length ? profits[profits.length-1] : 0;
  const lineColor = lastVal >= 0 ? '#3ECF8E' : '#EF5350';

  charts[canvasId] = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: { labels, datasets: [{ data: profits, borderColor: expanded ? '#C9A227' : lineColor, backgroundColor:'transparent', borderWidth: expanded?2:1.4, pointRadius:0, tension:0.25 }] },
    options: {
      responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{ legend:{display:false}, tooltip:{enabled:expanded} },
      scales: expanded ? { x:{ ticks:{color:'#7A828C',maxTicksLimit:6,font:{family:'JetBrains Mono',size:10}}, grid:{color:'#242A32'} }, y:{ ticks:{color:'#7A828C',font:{family:'JetBrains Mono',size:10}}, grid:{color:'#242A32'} } } : { x:{display:false}, y:{display:false} }
    }
  });
}
</script>
</body>
</html>
